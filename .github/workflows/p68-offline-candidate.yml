name: P68 Offline Release Candidate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/p68-offline-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p68-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.head_ref == 'p68-production-release-readiness' || github.head_ref == 'p71-acceptance-evidence-controlled-release' || github.head_ref == 'p72-visual-device-acceptance-closure' || github.head_ref == 'p73-release-evidence-integrity' || github.head_ref == 'p74-independent-evidence-reconciliation' || github.head_ref == 'p75-human-approval-intake' || github.head_ref == 'p76-exact-head-release-rehearsal' || github.head_ref == 'p77-artifact-recovery-human-readiness' || github.head_ref == 'p78-cross-artifact-human-decision' || github.head_ref == 'p79-independent-reviewer-packet' || github.head_ref == 'p80-human-claim-intake-release-hold' || github.head_ref == 'p81-core-chess-journeys' || github.head_ref == 'p82-chessboard-pointer-interaction' || (github.event_name == 'workflow_dispatch' && (github.ref_name == 'p68-production-release-readiness' || github.ref_name == 'p71-acceptance-evidence-controlled-release' || github.ref_name == 'p72-visual-device-acceptance-closure' || github.ref_name == 'p73-release-evidence-integrity' || github.ref_name == 'p74-independent-evidence-reconciliation' || github.ref_name == 'p75-human-approval-intake' || github.ref_name == 'p76-exact-head-release-rehearsal' || github.ref_name == 'p77-artifact-recovery-human-readiness' || github.ref_name == 'p78-cross-artifact-human-decision' || github.ref_name == 'p79-independent-reviewer-packet' || github.ref_name == 'p80-human-claim-intake-release-hold' || github.ref_name == 'p81-core-chess-journeys' || github.ref_name == 'p82-chessboard-pointer-interaction'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # This is explicitly NOT an authenticated production build.
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert immutable offline candidate source
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Pin Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and release-gate tests
        run: |
          npm run lock:audit
          npm run release:gate:test
          npm run visual:review:test
          npm run p71:review:test
          npm run p72:device:test
          npm run p72:visual:test
          npm run p73:integrity:test
          npm run p74:release:test
          npm run p75:human:test
          npm run p76:rehearsal:test
          npm run p77:recovery:test
          npm run p78:decision:test
          npm run p79:review:test
          npm run p80:claims:test
          npm test
      - name: Build artifact and enforce performance limits
        run: |
          npm run build
          npm run perf:budget
          npm run release:audit
      - name: Write immutable candidate provenance
        shell: bash
        run: |
          mkdir -p candidate-evidence
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "candidate_type=OFFLINE_PREVIEW_ONLY"
            echo "authenticated_sync=NOT_QUALIFIED"
            echo "production_deploy=NO"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
          } > candidate-evidence/RELEASE-CANDIDATE.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > candidate-evidence/SHA256SUMS.txt
      - name: Rehearse immutable offline package verification (no rollback claim or publication)
        run: node scripts/p76-release-rehearsal.mjs inspect-offline . "$CANDIDATE_SHA"
      - name: Audit hidden output before allowing complete artifact upload
        shell: bash
        run: |
          test -f dist/.vite/manifest.json
          hidden_files=$(find dist -type f -path '*/.*' | LC_ALL=C sort)
          test "$hidden_files" = 'dist/.vite/manifest.json'
      - name: Upload static candidate and checksum manifest (no publish)
        uses: actions/upload-artifact@v4
        with:
          name: chess-p68-offline-candidate-${{ github.run_id }}
          path: |
            dist/
            candidate-evidence/
          retention-days: 21
          # .vite/manifest.json is required for immutable checksum verification.
          # The previous audit rejects any unexpected hidden output before upload.
          include-hidden-files: true
          if-no-files-found: error

  recovery:
    name: Independently verify downloaded guest-only artifact
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source of verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Ensure verifier source matches offline artifact SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Pin Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact workflow artifact from GitHub storage
        uses: actions/download-artifact@v4
        with:
          name: chess-p68-offline-candidate-${{ github.run_id }}
          path: recovered/
      - name: Independently hash-check downloaded artifact and prior P76 receipt
        run: |
          mkdir -p recovery-evidence
          node scripts/p77-recovery-verifier.mjs recovered "$CANDIDATE_SHA" recovery-evidence/P77-RECOVERY.json
      - name: Preserve read-only recovered evidence
        uses: actions/upload-artifact@v4
        with:
          name: chess-p77-independent-recovery-${{ github.run_id }}
          path: recovery-evidence/P77-RECOVERY.json
          if-no-files-found: error
          retention-days: 21

# This workflow does not merge, tag, release, set repository variables or deploy Pages.
