name: P68 Temporary Playwright Lock Refresh
on:
  push:
    branches: [p68-production-release-readiness]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'thiepn/chess'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile without running postinstall
        shell: bash
        run: |
          node -e "if(require('./package.json').devDependencies['@playwright/test'] !== '1.57.0') process.exit(1)"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "if(require('./package-lock.json').packages['node_modules/@playwright/test'].version !== '1.57.0') process.exit(1)"
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'P68: lock Playwright 1.57.0 and WebKit regression fix'
          git push origin HEAD:refs/heads/p68-production-release-readiness
