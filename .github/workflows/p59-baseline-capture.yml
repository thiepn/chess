# Temporary and branch-restricted: deleted before P59 is merged.
name: P59 Baseline Capture
on:
  push:
    branches: [p59-visual-design-qa]

permissions:
  contents: write

concurrency:
  group: p59-visual-baselines
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run visual:update
      - name: Commit baseline candidates to P59 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/chess.visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "P59: refresh desktop and phone visual baselines"
          git push origin HEAD:p59-visual-design-qa
      - name: Store captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p59-baselines
          path: |
            test-results/
            playwright-report/
            tests/visual/chess.visual.spec.ts-snapshots/
          retention-days: 14
