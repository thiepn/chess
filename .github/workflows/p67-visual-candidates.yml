name: P67 Visual Candidates

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/visual/**'
      - 'playwright.config.ts'
      - '.github/workflows/p67-visual-candidates.yml'
      - 'scripts/build-visual-review.mjs'
      - 'scripts/build-visual-review.test.mjs'
      - 'scripts/p71-acceptance.mjs'
      - 'scripts/p71-acceptance.test.mjs'
      - 'scripts/p72-device-acceptance.mjs'
      - 'scripts/p72-device-acceptance.test.mjs'
      - 'scripts/p72-visual-reconcile.mjs'
      - 'scripts/p72-visual-reconcile.test.mjs'
      - 'scripts/p73-verify-visual-artifact.mjs'
      - 'scripts/p73-verify-visual-artifact.test.mjs'
      - 'scripts/p74-release-reconcile.mjs'
      - 'scripts/p74-release-reconcile.test.mjs'
      - 'scripts/p75-human-approval-intake.mjs'
      - 'scripts/p75-human-approval-intake.test.mjs'
      - 'scripts/p76-release-rehearsal.mjs'
      - 'scripts/p76-release-rehearsal.test.mjs'
      - 'scripts/p77-recovery-verifier.mjs'
      - 'scripts/p77-recovery-verifier.test.mjs'
      - 'scripts/p78-human-decision.mjs'
      - 'scripts/p78-human-decision.test.mjs'
      - 'scripts/p79-independent-review.mjs'
      - 'scripts/p79-independent-review.test.mjs'
      - 'scripts/p80-human-claims.mjs'
      - 'scripts/p80-human-claims.test.mjs'
      - 'docs/P81_CORE_CHESS_EXPERIENCE.md'
      - 'src/interaction/board-pointer.ts'
      - 'src/interaction/board-pointer.test.ts'
      - 'src/engine/stockfish.test.ts'
      - 'src/play/opponentSearch.ts'
      - 'src/play/opponentSearch.test.ts'
      - 'src/play/gameRecovery.ts'
      - 'src/play/gameRecovery.test.ts'
      - 'src/review/variation.ts'
      - 'src/review/variation.test.ts'
      - 'src/components/GameStoryView.tsx'
      - 'src/components/ReviewView.tsx'
      - 'src/styles/review-v2.css'

permissions:
  contents: read

concurrency:
  group: p67-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidates:
    if: github.head_ref == 'p67-release-candidate-acceptance' || github.head_ref == 'p69c-account-visual-qualification' || github.head_ref == 'p70-release-blocker-closure' || github.head_ref == 'p71-acceptance-evidence-controlled-release' || github.head_ref == 'p72-visual-device-acceptance-closure' || github.head_ref == 'p73-release-evidence-integrity' || github.head_ref == 'p74-independent-evidence-reconciliation' || github.head_ref == 'p75-human-approval-intake' || github.head_ref == 'p76-exact-head-release-rehearsal' || github.head_ref == 'p77-artifact-recovery-human-readiness' || github.head_ref == 'p78-cross-artifact-human-decision' || github.head_ref == 'p79-independent-reviewer-packet' || github.head_ref == 'p80-human-claim-intake-release-hold' || github.head_ref == 'p81-core-chess-journeys' || github.head_ref == 'p82-chessboard-pointer-interaction' || github.head_ref == 'p83-stockfish-opponent-v2' || github.head_ref == 'p84-complete-game-experience' || github.head_ref == 'p85-game-review-v2' || github.head_ref == 'p86-personalized-review-training'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact visual candidate source commit
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_EXPECTED_PAIRS: '18'
        run: test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact PR candidate
        run: npm run build
      - name: Preserve existing approved references
        shell: bash
        run: |
          mkdir -p p69c-visual-review/baseline p69c-visual-review/candidate
          cp tests/visual/chess.visual.spec.ts-snapshots/*-linux.png p69c-visual-review/baseline/
      - name: Render revised screenshots (not approved)
        run: npm run visual:update
      - name: Pair and label candidate screenshots
        shell: bash
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_EXPECTED_PAIRS: '18'
        run: |
          cp tests/visual/chess.visual.spec.ts-snapshots/*-linux.png p69c-visual-review/candidate/
          node scripts/build-visual-review.mjs p69c-visual-review
      - name: Independently verify actual image bytes against exact commit and manifest
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/p73-verify-visual-artifact.mjs p69c-visual-review "$REVIEW_SHA"
      - name: Prepare independent human review worksheet (never approval)
        run: node scripts/p71-acceptance.mjs prepare p69c-visual-review/manifest.json p69c-visual-review
      - name: Reconcile image decisions against immutable hashes (PENDING only)
        run: node scripts/p72-visual-reconcile.mjs p69c-visual-review/manifest.json p69c-visual-review/p72-decision-inventory.md
      - name: Prepare read-only P74 release evidence receipt (always HOLD)
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/p74-release-reconcile.mjs p69c-visual-review "$REVIEW_SHA"
      - name: Create P75 human evidence intake and baseline change proposal (NO APPROVAL)
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/p75-human-approval-intake.mjs p69c-visual-review "$REVIEW_SHA"
      - name: Prepare P79 source-bound independent review queue (PENDING only)
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/p79-independent-review.mjs p69c-visual-review "$REVIEW_SHA"
      - name: Publish P80 automated zero-claim HOLD receipt only (no human evidence)
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/p80-human-claims.mjs p69c-visual-review "$REVIEW_SHA" p69c-visual-review/p80-automated-hold.json
      - name: Record candidate hashes
        shell: bash
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "Candidate commit: $REVIEW_SHA"
            echo "Generated reference images (UNAPPROVED):"
            sha256sum tests/visual/chess.visual.spec.ts-snapshots/*-linux.png
            echo "Changed images:"
            git diff --name-only -- tests/visual/chess.visual.spec.ts-snapshots
          } > p67-visual-review.txt
      - name: Save candidate images for independent visual review
        uses: actions/upload-artifact@v4
        with:
          name: p67-unapproved-visual-candidates-${{ github.run_id }}
          path: |
            tests/visual/chess.visual.spec.ts-snapshots/*-linux.png
            p67-visual-review.txt
            p69c-visual-review/
          retention-days: 21
          if-no-files-found: error

# This workflow NEVER commits a baseline or changes visual comparison thresholds.
