name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: test -f public/engine/manifest.json
      - run: test -f public/engine/stockfish-19-lite-single.js
      - run: test -f public/engine/stockfish-19-lite-single.wasm
      - run: npm run lock:audit
      - run: npm run release:gate:test
      - run: npm run visual:review:test
      - run: npm run puzzles:build -- scripts/fixtures/lichess-sample.csv --out /tmp/chess-puzzles --max-per-skill 20
      - run: test -f /tmp/chess-puzzles/manifest.json
      - run: npm run puzzles:production
      - run: npm run puzzles:audit
      - run: npm test
      - run: npm run design:audit
      - run: npm run motion:audit
      - run: npm run mobile:audit
      - run: npm run desktop:audit
      - run: npm run a11y:audit
      - run: npm run theme:audit
      - run: npm run content:audit
      - run: npm run build
      - run: npm run perf:budget
      - run: npm run release:audit
