name: P66 Generate Reproducible Lockfile

# One-off, narrowly scoped maintainer-branch bootstrapping.
# The generated lockfile will be reviewed before this workflow is removed.
on:
  push:
    branches: [p66-performance-security-delivery]

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'thiepn/chess'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate a lockfile without executing install scripts
        shell: bash
        run: |
          if test -f package-lock.json; then
            echo "A committed lockfile already exists."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "P66: commit npm dependency lockfile"
          git push origin "HEAD:refs/heads/p66-performance-security-delivery"
