# Temporary P59B branch-only baseline generation; remove before merge.
name: P59B Baseline Capture

on:
  push:
    branches: [p59b-review-board-refinement]

permissions:
  contents: write

concurrency:
  group: p59b-baseline-capture
  cancel-in-progress: false

jobs:
  recapture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run visual:update
      - name: Commit visual candidates to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/chess.visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "P59B: update reviewed screenshot candidates"
          git push origin HEAD:p59b-review-board-refinement
      - name: Store browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p59b-visual-candidates
          path: |
            tests/visual/chess.visual.spec.ts-snapshots/
            test-results/
            playwright-report/
          retention-days: 14
