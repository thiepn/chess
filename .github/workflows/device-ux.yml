name: Device UX Prequalification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p58-device-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-device-browser:
    # Isolate iOS WebKit from Chromium. Every existing test still runs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ios-webkit
            browser: webkit
            projects: "--project=mobile-webkit"
          - label: chromium-devices
            browser: chromium
            projects: "--project=android-compact --project=android-phone --project=tablet-portrait --project=tablet-landscape --project=desktop"
    name: cross-device-browser (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and WebKit engines
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build production app
        run: npm run build
      - name: Run responsive UX journeys
        run: npm run ux:verify -- ${{ matrix.projects }}
      - name: Preserve traces and device timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p67-device-ux-${{ matrix.label }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn
