name: Device UX Prequalification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p58-device-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-device-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Install Chromium and WebKit engines
        run: npx playwright install --with-deps chromium webkit
      - name: Build production app
        run: npm run build
      - name: Run responsive UX journeys
        run: npm run ux:verify
      - name: Preserve traces and device timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p58-device-ux-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn
