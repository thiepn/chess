# Temporary P57 branch-only snapshot generation. Remove before merge.
name: P57 Baseline Bootstrap
on:
  push:
    branches: [p57-visual-regression-suite]

permissions:
  contents: write

jobs:
  seed:
    if: github.repository == 'thiepn/chess'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Recapture branch-only baselines after mobile defect repair
        run: npm run visual:update
      - name: Commit reviewed candidates to P57 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/chess.visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "P57: refresh visual baselines after mobile Play grid fix"
          git push origin HEAD:p57-visual-regression-suite
      - name: Preserve screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p57-screenshot-diagnostics
          path: |
            tests/visual/chess.visual.spec.ts-snapshots/
            test-results/
            playwright-report/
          retention-days: 14
